<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HangarRate{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-plane"/></svg> HangarRate
    </a>
    <nav>
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Pricing</a>
      <a href="{{ url_for('playground') }}" {% if request.endpoint == 'playground' %}class="active"{% endif %}>Style playground</a>
    </nav>
  </header>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></symbol>
  </svg>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/loader.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
